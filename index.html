<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大烧货LINK — 手表遥控 PC 上的 DeepSeek Harness</title>
<style>
  :root { --bg:#151517; --card:#232324; --fg:#F9FAFB; --dim:#ADB2B8; --dim2:#6B7280; --accent:#7AAAFF; --line:#2C2C2E; }
  * { box-sizing:border-box; }
  body { margin:0; padding:56px 18px; background:var(--bg); color:var(--fg);
         font-family:"Microsoft YaHei UI","PingFang SC","Helvetica Neue",Arial,sans-serif; line-height:1.8; }
  .wrap { max-width:720px; margin:0 auto; text-align:center; }
  h1 { font-size:30px; margin:0 0 8px; }
  .sub { color:var(--dim); font-size:15px; margin-bottom:34px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; text-align:left; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card p { margin:0; color:var(--dim); font-size:13.5px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .links { margin-top:34px; font-size:14px; color:var(--dim2); }
  .links a { margin:0 10px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>大烧货LINK</h1>
  <div class="sub">把手表变成 DeepSeek Harness 的随身控制中心</div>

  <div class="grid">
    <div class="card">
      <h3>一键操控</h3>
      <p>提交 / 停止 / 命令 / 目标 / 计划 / 批准，6 个自定义 Agent 键，腕上直达。</p>
    </div>
    <div class="card">
      <h3>实时进度</h3>
      <p>项目进度 → 会话列表 → 历史对话三级下钻，五色状态灯与震动提醒。</p>
    </div>
    <div class="card">
      <h3>全屏摇杆</h3>
      <p>四方向映射快捷键，圆屏弧形界面 + 表冠滚动 + 振动反馈。</p>
    </div>
    <div class="card">
      <h3>免手动配置</h3>
      <p>首次填写电脑 IP 与配对码，之后每次打开自动连接；数据仅走局域网。</p>
    </div>
  </div>

  <div class="links">
    <a href="./privacy.html">隐私政策</a> ·
    <a href="./PRIVACY.md">隐私政策（Markdown）</a> ·
    <a href="https://github.com/crowntoday555-art/dshlink">GitHub 仓库</a>
  </div>

</div>
</body>
</html>
